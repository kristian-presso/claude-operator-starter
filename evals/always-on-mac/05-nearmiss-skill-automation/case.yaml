schema_version: '1.0'
name: 05-nearmiss-skill-automation
tags:
- always-on-mac
- near-miss
- agent-builder
runs: 3
execution:
  prompt: |
    I keep explaining to Claude how to format my weekly investor update. Can you turn that into a reusable skill?
  max_turns: 12
  timeout_seconds: 360
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: always-on-mac
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if this is true of the reply: It starts building a reusable skill for the weekly investor update (for example asking what the update contains or drafting a SKILL.md with a name and description), rather than discussing scheduling or servers.
  weight: 1
