schema_version: '1.0'
name: 01-exit-zero-nothing-happens
tags:
- always-on-mac
- fire
runs: 3
execution:
  prompt: |
    I set up a launchd job on my Mac mini that runs `claude -p` every night to write a report. launchctl shows last exit code 0 every day, but no report ever appears. What's going on and how do I fix it properly?
  max_turns: 12
  timeout_seconds: 360
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: always-on-mac
  weight: 1
- type: llm
  name: bare-path
  criteria: |
    Pass if this is true of the reply: It identifies launchd's minimal PATH (/usr/bin:/bin:/usr/sbin:/sbin) as the likely cause, so the job cannot find claude (typically in ~/.local/bin).
  weight: 1
- type: llm
  name: wrapper-or-env
  criteria: |
    Pass if this is true of the reply: It fixes it by setting PATH in the plist's EnvironmentVariables or starting the job through a wrapper script that exports PATH.
  weight: 1
- type: llm
  name: outcome-not-exit
  criteria: |
    Pass if this is true of the reply: It recommends recording an outcome (whether the work actually succeeded) rather than trusting the exit code, and/or an off-machine alert when a run does not succeed.
  weight: 1
