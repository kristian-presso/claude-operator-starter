schema_version: '1.0'
name: 04-nearmiss-cloud-cron
tags:
- always-on-mac
- near-miss
runs: 3
execution:
  prompt: |
    Write me a GitHub Actions workflow that runs a Python script every day at 06:00 UTC.
  max_turns: 12
  timeout_seconds: 360
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: always-on-mac
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if this is true of the reply: It provides a GitHub Actions workflow with a schedule trigger using a cron expression for 06:00 UTC (0 6 * * *) that runs the Python script.
  weight: 1
