schema_version: '1.0'
name: 04-nearmiss-claude-md-question
tags:
- setup-operator
- near-miss
runs: 3
execution:
  prompt: |
    Quick question: in Claude Code, what is the difference between CLAUDE.md and CLAUDE.local.md?
  max_turns: 4
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: setup-operator
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: answers-the-question
  criteria: |
    Pass if the reply explains that CLAUDE.md holds shared project instructions (usually committed) and CLAUDE.local.md holds personal, uncommitted ones, without starting an interview or writing files.
  weight: 1
