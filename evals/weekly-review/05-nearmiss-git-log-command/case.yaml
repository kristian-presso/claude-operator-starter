schema_version: '1.0'
name: 05-nearmiss-git-log-command
tags:
- weekly-review
- near-miss
runs: 3
execution:
  prompt: |
    What git command shows me only the commits from the last 7 days, one line each?
  max_turns: 4
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: weekly-review
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: gives-command
  criteria: |
    Pass if the reply gives a git log command using --since (or --after) with 7 days and --oneline (or an equivalent one-line format).
  weight: 1
