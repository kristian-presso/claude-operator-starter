schema_version: '1.0'
name: 04-nearmiss-performance-review
tags:
- weekly-review
- near-miss
runs: 3
execution:
  prompt: |
    Write a performance review for my employee Alex: strong on customer calls, often late with reports. Keep it to five sentences.
  max_turns: 4
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: weekly-review
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply is a short performance review of Alex that mentions strength on customer calls and lateness with reports.
  weight: 1
